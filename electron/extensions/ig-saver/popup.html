<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Saver - Perfis Favoritos</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-wrapper">
    <div class="popup-card">
      <!-- Header -->
      <header class="popup-header">
        <div class="header-title-group">
          <div class="header-star-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#F59E0B" stroke="#F59E0B" stroke-width="1">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </div>
          <h1 class="header-title">Perfis Favoritos</h1>
        </div>
        <button type="button" class="header-close-btn" id="close-popup-btn" title="Fechar" aria-label="Fechar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <!-- Platform Segmented Tabs (Image 1 & 2) -->
      <nav class="platform-tabs" role="tablist" aria-label="Plataformas">
        <button type="button" class="platform-tab is-active" id="tab-instagram" data-platform="instagram" role="tab" aria-selected="true">
          <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span class="tab-label">Instagram</span>
          <span class="tab-badge" id="count-instagram">0</span>
        </button>
        <button type="button" class="platform-tab" id="tab-tiktok" data-platform="tiktok" role="tab" aria-selected="false">
          <svg class="tab-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.29 0 .58.04.85.12V9.33a6.33 6.33 0 0 0-1-.08A6.34 6.34 0 0 0 3 15.6a6.34 6.34 0 0 0 10.82 4.48 6.3 6.3 0 0 0 1.87-4.49V8.58a8.3 8.3 0 0 0 4.9 1.57V6.69z"/>
          </svg>
          <span class="tab-label">TikTok</span>
          <span class="tab-badge" id="count-tiktok">0</span>
        </button>
      </nav>

      <!-- Quick Add Profile Bar (Image 3) -->
      <section class="quick-add-section" id="quick-add-section" aria-label="Adicionar perfil aos favoritos" hidden>
        <div class="quick-add-wrapper" id="quick-add-wrapper">
          <span class="quick-add-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
          </span>
          <input type="text" id="quick-add-input" class="quick-add-input" placeholder="@usuario..." autocomplete="off" spellcheck="false">
          <button type="button" id="quick-add-btn" class="quick-add-btn">
            Favoritar
          </button>
        </div>
      </section>

      <!-- Search Section -->
      <section class="search-section" aria-label="Buscar favoritos">
        <div class="search-input-wrapper">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="favorites-search" placeholder="Buscar perfil salvo..." autocomplete="off" spellcheck="false">
          <button type="button" id="clear-search" class="clear-search-btn" hidden aria-label="Limpar busca">&times;</button>
        </div>
      </section>

      <!-- Favorites List (Image 2) -->
      <section class="favorites-section">
        <div class="favorites-list" id="favorites-list" role="list">
          <!-- Populated dynamically by popup.js -->
        </div>
        <div id="empty-state" class="empty-state" hidden>
          <p class="empty-title">Nenhum perfil favoritado</p>
          <p class="empty-subtitle">Navegue até um perfil ou digite acima para adicionar.</p>
        </div>
      </section>

      <!-- Status toast message -->
      <p id="popup-status" role="status" aria-live="polite" hidden></p>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
